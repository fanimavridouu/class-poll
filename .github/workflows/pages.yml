name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          mkdir -p site/css site/js
          cp index.html admin.html 404.html .nojekyll site/
          cp css/app.css site/css/
          cp js/*.js site/js/
          python3 - <<'PY'
          import json, os, pathlib
          url = os.environ.get("APPS_SCRIPT_URL") or "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"
          cid = os.environ.get("GOOGLE_CLIENT_ID") or "YOUR_CLIENT_ID.apps.googleusercontent.com"
          pathlib.Path("site/config.js").write_text(
              "window.CLASS_POLL_CONFIG = {\n  APPS_SCRIPT_URL: %s,\n  GOOGLE_CLIENT_ID: %s,\n};\n"
              % (json.dumps(url), json.dumps(cid)),
              encoding="utf-8",
          )
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
